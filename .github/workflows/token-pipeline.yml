name: Transform Figma Tokens into Production Code
on:
  push:
    branches:
      - main
    paths:
      - 'tokens.json'
      - '.github/workflows/token-pipeline.yml'

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches the entire git history to handle rebasing smoothly

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Build Systems
        run: npm install

      - name: Run Style Dictionary Compiler
        run: node build.js

      - name: Deploy Compiled Tokens to Homepage
        run: |
          git config --global user.name "Soliteck DesignBot"
          git config --global user.email "designbot@soliteck.com"
          git add build/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: automated compilation of web and android token updates [skip ci]"
            git pull --rebase origin main # Pulls your latest web edits first to eliminate sync rejections
            git push origin main
          fi

