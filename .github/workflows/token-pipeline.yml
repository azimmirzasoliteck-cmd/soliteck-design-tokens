name: Transform Figma Tokens into Production Code
on:
  push:
    branches:
      - main
    paths:
      - 'tokens.json'
      - '.github/workflows/token-pipeline.yml' # Allows manual test triggers when updating this file

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Build Systems
        run: npm install # Ensures all package config dependencies fetch properly

      - name: Run Style Dictionary Compiler
        run: node build.js # Explicitly executes your custom javascript pre-parser script
