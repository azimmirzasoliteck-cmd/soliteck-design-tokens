name: Transform Figma Tokens into Production Code
on:
  push:
    branches:
      - main
    paths:
      - 'tokens.json'
      - 'build.js' # Crucial: Triggers a fresh run whenever build.js updates!
      - '.github/workflows/token-pipeline.yml'

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Build Systems
        run: npm install

      - name: Run Style Dictionary Compiler
        run: node build.js

      - name: Deploy Compiled Tokens to Homepage
        run: |
          git config --global user.name "Soliteck DesignBot"
          git config --global user.email "designbot@soliteck.com"
          rm -f tokens-sanitized.json
          git add build/
          git commit -m "chore: automated compilation of web and android token updates [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main || echo "Push skipped or already up to date"
